name: Deploy Wiki to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions-setup@v5
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install
        working-directory: .

      - name: Build Project
        run: npm run build
        working-directory: .

      - name: Setup Pages
        uses: actions/deploy-pages@v4
